version: '3.8'

networks:
  db-data-net:
    driver: bridge

volumes:
  db_data:

services:
  db-service:
    build:
      context: . 
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: . 
      dockerfile: Dockerfile
    container_name: django-app
    ports:
      - "8080:8080"
    networks:
      - db-data-net
    depends_on:
      db-service:
        condition: service_healthy
    entrypoint: >
      sh -c "python manage.py migrate python --noinput && 
             python manage.py runserver 0.0.0.0:8080"
